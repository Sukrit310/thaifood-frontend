name: Frontend checks
on:
  push:
    paths: ['thaifood/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['thaifood/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thaifood
    env:
      CI: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: thaifood/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
